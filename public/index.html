<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reporte de leads de pauta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF1F6; --chart:#FCFCFB;
  --ink:#16202B; --ink-2:#4F5D6C; --ink-3:#7E8B99;
  --line:#DCE3EB; --line-2:#EAEFF4; --grid:#E6EAEF; --axis:#C9D1DA;
  --accent:#2a78d6; --accent-ink:#1c5cab; --hs:#eb6834;
  --st-good:#0ca30c; --st-warn:#fab219; --st-neutral:#9d9c95; --st-serious:#ec835a; --st-critical:#d03b3b;
  --focus:#2a78d6;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 8px 24px -12px rgba(22,32,43,.18);
  --display:"Sora",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F141B; --surface:#171E27; --surface-2:#1F2833; --chart:#171E27;
    --ink:#EEF2F6; --ink-2:#A9B5C2; --ink-3:#7B8794;
    --line:#2A3441; --line-2:#222C38; --grid:#253040; --axis:#364354;
    --accent:#3987e5; --accent-ink:#86b6ef; --hs:#d95926;
    --st-neutral:#7a7973;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F141B; --surface:#171E27; --surface-2:#1F2833; --chart:#171E27;
  --ink:#EEF2F6; --ink-2:#A9B5C2; --ink-3:#7B8794;
  --line:#2A3441; --line-2:#222C38; --grid:#253040; --axis:#364354;
  --accent:#3987e5; --accent-ink:#86b6ef; --hs:#d95926;
  --st-neutral:#7a7973;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:32px 24px 56px}
@media (max-width:640px){.wrap{padding:20px 16px 40px}}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(24px,3.4vw,34px);font-weight:700;line-height:1.15}
h2{font-size:19px;font-weight:600;line-height:1.3}
h3{font-size:15.5px;font-weight:600}
p{margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2)}

/* Acceso */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);display:grid;gap:16px}
.gate-card label{font-size:13.5px;font-weight:500;color:var(--ink-2)}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.6;cursor:progress}
.error{color:var(--st-critical);font-size:13.5px;min-height:1.2em}

/* Encabezado */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.top .ttl{display:grid;gap:8px;max-width:70ch}
.meta-line{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-3);font-size:13px}
.meta-line b{color:var(--ink-2);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-2);margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;text-decoration:none;margin-bottom:12px}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}
@media (max-width:640px){.card{padding:16px}}
.sec-head{display:grid;gap:4px;margin-bottom:14px;max-width:72ch}
.sec-head p{color:var(--ink-2);font-size:14px}
.grid-prov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px}
@media (max-width:760px){.grid-prov{grid-template-columns:1fr}}
.prov{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:border-color .15s, transform .15s}
a.prov:hover{border-color:var(--accent);transform:translateY(-1px)}
.prov.off{box-shadow:none;background:transparent;border-style:dashed}
.prov-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.prov-head .go{font-size:13.5px;color:var(--accent-ink);font-weight:500;white-space:nowrap}
.prov-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:420px){.prov-nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.n-lbl{font-size:12px;color:var(--ink-3);line-height:1.3}
.n-val{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.n-val small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:3px;font-family:var(--body)}
.hbar{display:flex;height:10px;gap:2px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.hbar span{display:block;height:100%;min-width:3px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles,.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:4px;align-content:start}
.tile .n-val{font-size:28px}
.tile .n-sub{font-size:12.5px;color:var(--ink-2);line-height:1.4}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin-bottom:18px}
.f{display:grid;gap:4px}
.f label,.f .lbl{font-size:12px;color:var(--ink-3);font-weight:500}
.f select,.f input{min-height:38px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);max-width:100%}
.f select{max-width:320px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 14px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);font-weight:600}

/* Estatus */
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.st i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;flex:none;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin:4px 0 10px}

/* Gráfica */
.chartwrap{position:relative}
svg.chart{display:block;width:100%;height:auto}
svg.chart text{font-family:var(--body)}
.tick{font-size:11.5px;fill:var(--ink-3)}
.gridl{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1}
.col-hit{fill:transparent;cursor:default}
.col-hit:focus{outline:none}
.col:hover .seg-r,.col.act .seg-r{filter:brightness(1.08)}
.col.act .col-bg{fill:var(--surface-2)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;min-width:190px;max-width:280px}
.tip .th{font-weight:600;margin-bottom:6px}
.tip .tr{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;line-height:1.7}
.tip .tr b{font-variant-numeric:tabular-nums;text-align:right}
.tip .tr .k{height:3px;border-radius:2px}
.tip .tr span{color:var(--ink-2)}

/* Tablas */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tr.clic{cursor:pointer}
tfoot td{font-weight:600;border-bottom:0}
details.tbl{margin-top:12px;border-top:1px solid var(--line-2);padding-top:10px}
details.tbl summary{cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.75}
.list-tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.list-tools input{min-height:38px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);width:260px;max-width:100%}
.person{min-width:200px}
.person b{font-weight:500;display:block}
.person span{color:var(--ink-3);font-size:12.5px;overflow-wrap:anywhere}
.links a{display:inline-block;margin-right:10px;white-space:nowrap}
.more{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{padding:22px 0;color:var(--ink-3)}
.how{display:grid;gap:10px;font-size:14px;color:var(--ink-2)}
.how dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.how dt{white-space:nowrap}
.how dd{margin:0}
@media (max-width:560px){.how dl{grid-template-columns:1fr}.how dd{margin-bottom:6px}}
.flag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.cmp{box-shadow:var(--shadow)}
.cmp-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
.cmp-head .go{font-size:13.5px;color:var(--accent-ink);font-weight:500;white-space:nowrap;text-decoration:none}
.cmp-head .go:hover{text-decoration:underline}
.verdict{display:flex;gap:12px;align-items:center;border-radius:12px;padding:12px 14px;background:var(--surface-2);font-size:15px;font-weight:500}
.verdict .ico{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.verdict.ok .ico{background:var(--st-good);color:#fff}
.verdict.warn .ico{background:var(--st-serious);color:#1b1b1b}
.pills{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px}
.pills .pg{display:inline-flex;align-items:center;gap:8px}
.pills .pg b{font-weight:500}
footer{color:var(--ink-3);font-size:12.5px;margin-top:28px}
</style>
</head>
<body>

<div id="gate" class="gate">
  <form class="gate-card" id="gate-form" autocomplete="off">
    <div style="display:grid;gap:6px">
      <div class="eyebrow">Pauta → HubSpot</div>
      <h1 style="font-size:24px">Reporte de leads de pauta</h1>
      <p class="sub" style="font-size:14px">Para ver el reporte, escribes la contraseña que te compartió el equipo de Black &amp; Orange.</p>
    </div>
    <div style="display:grid;gap:6px">
      <label for="pw">Contraseña</label>
      <input id="pw" class="field" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" id="gate-btn" type="submit">Ver el reporte</button>
    <div class="error" id="gate-err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <div class="ttl">
        <div class="eyebrow" id="eyebrow">Pauta → HubSpot</div>
        <h1 id="h1">Leads de pauta vs HubSpot</h1>
        <div class="meta-line" id="meta"></div>
      </div>
      <div class="actions">
        <button class="btn" id="btn-refresh" type="button">Actualizar</button>
        <button class="btn" id="btn-out" type="button">Salir</button>
      </div>
    </header>
    <div class="notice" id="notice" role="status" hidden></div>
    <main id="view"></main>
    <footer id="foot"></footer>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<script>
'use strict';
/* ---------- Estado ---------- */
const S = { data: null, sobre: null, llave: null, filtros: {}, lista: {} };
const EST = {
  completo:     { lbl: 'Negocio a tiempo', corto: 'A tiempo', v: '--st-good',     ico: '✓', fg: '#fff' },
  previo:       { lbl: 'Ya tenía negocio', corto: 'Ya tenía', v: '--st-neutral',  ico: '↺', fg: '#fff' },
  tardio:       { lbl: 'Negocio tardío',   corto: 'Tardío',   v: '--st-warn',     ico: '◷', fg: '#1b1b1b' },
  sin_negocio:  { lbl: 'Sin negocio',      corto: 'Sin negocio', v: '--st-serious', ico: '!', fg: '#1b1b1b' },
  sin_contacto: { lbl: 'Sin contacto',     corto: 'Sin contacto', v: '--st-critical', ico: '✕', fg: '#fff' },
};
const ORDEN = ['completo', 'previo', 'tardio', 'sin_negocio', 'sin_contacto'];
const $ = s => document.querySelector(s);

/* ---------- DOM seguro: todo dato va como texto ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const NS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function badge(st, texto) {
  const e = EST[st];
  return h('span', { class: 'st' }, h('i', { style: `background:var(${e.v});color:${e.fg}`, 'aria-hidden': 'true' }, e.ico), texto ?? e.lbl);
}

/* ---------- Formatos (zona del portal) ---------- */
let F = {};
function prepararFormatos(zona) {
  const o = { timeZone: zona };
  F.dia = new Intl.DateTimeFormat('es-MX', { ...o, day: 'numeric', month: 'short', year: 'numeric' });
  F.diaCorto = new Intl.DateTimeFormat('es-MX', { ...o, day: 'numeric', month: 'short' });
  F.diaHora = new Intl.DateTimeFormat('es-MX', { ...o, day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  F.partes = new Intl.DateTimeFormat('en-CA', { ...o, year: 'numeric', month: '2-digit', day: '2-digit' });
  F.num = new Intl.NumberFormat('es-MX');
}
const fDia = t => F.dia.format(t).replace(/\./g, '');
const fDiaHora = t => F.diaHora.format(t).replace(/\./g, '');
const fNum = n => F.num.format(n);
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function ymd(t) { const [y, m, d] = F.partes.format(t).split('-').map(Number); return { y, m, d }; }
function claveDia(t) { const { y, m, d } = ymd(t); return Date.UTC(y, m - 1, d); }
function inicioSemana(t) { const u = claveDia(t); const dow = (new Date(u).getUTCDay() + 6) % 7; return u - dow * 864e5; }
function inicioMes(t) { const { y, m } = ymd(t); return Date.UTC(y, m - 1, 1); }
function etiquetaPeriodo(u, agr) {
  const a = new Date(u);
  if (agr === 'mes') return `${MESES[a.getUTCMonth()]} ${a.getUTCFullYear()}`;
  const b = new Date(u + 6 * 864e5);
  return a.getUTCMonth() === b.getUTCMonth()
    ? `${a.getUTCDate()} – ${b.getUTCDate()} ${MESES[b.getUTCMonth()]}`
    : `${a.getUTCDate()} ${MESES[a.getUTCMonth()]} – ${b.getUTCDate()} ${MESES[b.getUTCMonth()]}`;
}
function siguiente(u, agr) { if (agr === 'mes') { const a = new Date(u); return Date.UTC(a.getUTCFullYear(), a.getUTCMonth() + 1, 1); } return u + 7 * 864e5; }
function duracion(horas) {
  const a = Math.abs(horas);
  if (a < 1) return `${Math.max(1, Math.round(a * 60))} min`;
  if (a < 48) return `${Math.round(a)} h`;
  const d = Math.round(a / 24); return `${d} día${d === 1 ? '' : 's'}`;
}

/* ---------- Descifrado ---------- */
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function derivar(pw, sobre) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(sobre.sal), iterations: sobre.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function abrir(sobre, llave) {
  const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(sobre.iv) }, llave, b64(sobre.datos));
  const flujo = new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(flujo).text());
}
async function traerSobre() {
  const r = await fetch(`data.enc.json?v=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('No se encontró el archivo del reporte.');
  return r.json();
}
function guardarLlave(llave, sobre) {
  crypto.subtle.exportKey('raw', llave).then(raw => {
    try { sessionStorage.setItem('rp_llave', JSON.stringify({ sal: sobre.sal, k: btoa(String.fromCharCode(...new Uint8Array(raw))) })); } catch (e) { /* sin almacenamiento */ }
  });
}
async function llaveGuardada(sobre) {
  try {
    const g = JSON.parse(sessionStorage.getItem('rp_llave') || 'null');
    if (!g || g.sal !== sobre.sal) return null;
    return crypto.subtle.importKey('raw', b64(g.k), { name: 'AES-GCM' }, true, ['decrypt']);
  } catch (e) { return null; }
}

async function iniciar() {
  if (!window.crypto?.subtle || !('DecompressionStream' in window)) {
    $('#gate-err').textContent = 'Este navegador no puede abrir el reporte. Para verlo, lo abres en una versión reciente de Chrome, Edge, Safari o Firefox.';
    $('#gate-btn').disabled = true; return;
  }
  try { S.sobre = await traerSobre(); } catch (e) { $('#gate-err').textContent = 'El reporte todavía no se ha generado. Vuelve a intentarlo en unos minutos.'; return; }
  const k = await llaveGuardada(S.sobre);
  if (k) { try { S.data = await abrir(S.sobre, k); S.llave = k; return entrar(); } catch (e) { /* pedir contraseña */ } }
  $('#pw').focus();
}
$('#gate-form').addEventListener('submit', async ev => {
  ev.preventDefault();

      await fetch(cfg.url, { method: 'POST', mode: 'no-cors', headers: { 'content-type': 'text/plain' }, body: JSON.stringify({ clave: cfg.clave }) });
      const inicio = Date.now();
      while (Date.now() - inicio < 6 * 60e3) {
        await new Promise(r => setTimeout(r, 15000));
        const m = await fetch(`meta.json?v=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()).catch(() => null);
        if (m && m.generadoEn && m.generadoEn !== antes) { await recargarSiHayNuevo(); aviso(''); return; }
      }
      aviso('La actualización está tardando más de lo normal. Puedes seguir usando el reporte; los datos nuevos aparecen al volver a entrar.');
    } else {
      btn.textContent = 'Buscando…';
      const cambio = await recargarSiHayNuevo();
      aviso(cambio ? '' : `Ya estás viendo la versión más reciente (${fDiaHora(Date.parse(antes))}). El reporte se actualiza solo cada hora.`);
    }
  } catch (e) {
    aviso('No se pudo actualizar en este momento. Vuelve a intentarlo en unos minutos.');
  } finally { btn.disabled = false; btn.textContent = 'Actualizar'; }
});

iniciar();
</script>
</body>
