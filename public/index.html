<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reporte de leads de pauta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF1F6; --chart:#FCFCFB;
  --ink:#16202B; --ink-2:#4F5D6C; --ink-3:#7E8B99;
  --line:#DCE3EB; --line-2:#EAEFF4; --grid:#E6EAEF; --axis:#C9D1DA;
  --accent:#2a78d6; --accent-ink:#1c5cab; --hs:#eb6834; --hs-ink:#b4471b; --crit-ink:#b02a2a;
  --st-good:#0ca30c; --st-warn:#fab219; --st-neutral:#9d9c95; --st-serious:#ec835a; --st-critical:#d03b3b;
  --focus:#2a78d6;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 8px 24px -12px rgba(22,32,43,.18);
  --display:"Sora",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F141B; --surface:#171E27; --surface-2:#1F2833; --chart:#171E27;
    --ink:#EEF2F6; --ink-2:#A9B5C2; --ink-3:#7B8794;
    --line:#2A3441; --line-2:#222C38; --grid:#253040; --axis:#364354;
    --accent:#3987e5; --accent-ink:#86b6ef; --hs:#d95926; --hs-ink:#f2925f; --crit-ink:#f07575;
    --st-neutral:#7a7973;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F141B; --surface:#171E27; --surface-2:#1F2833; --chart:#171E27;
  --ink:#EEF2F6; --ink-2:#A9B5C2; --ink-3:#7B8794;
  --line:#2A3441; --line-2:#222C38; --grid:#253040; --axis:#364354;
  --accent:#3987e5; --accent-ink:#86b6ef; --hs:#d95926; --hs-ink:#f2925f; --crit-ink:#f07575;
  --st-neutral:#7a7973;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:32px 24px 56px}
@media (max-width:640px){.wrap{padding:20px 16px 40px}}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(24px,3.4vw,34px);font-weight:700;line-height:1.15}
h2{font-size:19px;font-weight:600;line-height:1.3}
h3{font-size:15.5px;font-weight:600}
p{margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2)}

/* Acceso */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);display:grid;gap:16px}
.gate-card label{font-size:13.5px;font-weight:500;color:var(--ink-2)}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.6;cursor:progress}
.error{color:var(--st-critical);font-size:13.5px;min-height:1.2em}

/* Encabezado */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.top .ttl{display:grid;gap:8px;max-width:70ch}
.meta-line{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-3);font-size:13px}
.meta-line b{color:var(--ink-2);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-2);margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;text-decoration:none;margin-bottom:12px}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}
@media (max-width:640px){.card{padding:16px}}
.sec-head{display:grid;gap:4px;margin-bottom:14px;max-width:72ch}
.sec-head p{color:var(--ink-2);font-size:14px}
.grid-prov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px}
@media (max-width:760px){.grid-prov{grid-template-columns:1fr}}
.prov{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:border-color .15s, transform .15s}
a.prov:hover{border-color:var(--accent);transform:translateY(-1px)}
.prov.off{box-shadow:none;background:transparent;border-style:dashed}
.prov-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.prov-head .go{font-size:13.5px;color:var(--accent-ink);font-weight:500;white-space:nowrap}
.prov-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:420px){.prov-nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.n-lbl{font-size:12px;color:var(--ink-3);line-height:1.3}
.n-val{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.n-val small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:3px;font-family:var(--body)}
.hbar{display:flex;height:10px;gap:2px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.hbar span{display:block;height:100%;min-width:3px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles,.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:4px;align-content:start}
.tile .n-val{font-size:28px}
.tile .n-sub{font-size:12.5px;color:var(--ink-2);line-height:1.4}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin-bottom:18px}
.f{display:grid;gap:4px}
.f label,.f .lbl{font-size:12px;color:var(--ink-3);font-weight:500}
.f select,.f input{min-height:38px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);max-width:100%}
.f select{max-width:320px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 14px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);font-weight:600}

/* Estatus */
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.st i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;flex:none;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin:4px 0 10px}

/* Gráfica */
.chartwrap{position:relative}
svg.chart{display:block;width:100%;height:auto}
svg.chart text{font-family:var(--body)}
.tick{font-size:11.5px;fill:var(--ink-3)}
.gridl{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1}
.col-hit{fill:transparent;cursor:default}
.col-hit:focus{outline:none}
.col:hover .seg-r,.col.act .seg-r{filter:brightness(1.08)}
.col.act .col-bg{fill:var(--surface-2)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;min-width:190px;max-width:280px}
.tip .th{font-weight:600;margin-bottom:6px}
.tip .tr{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;line-height:1.7}
.tip .tr b{font-variant-numeric:tabular-nums;text-align:right}
.tip .tr .k{height:3px;border-radius:2px}
.tip .tr span{color:var(--ink-2)}

/* Tablas */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tr.clic{cursor:pointer}
tfoot td{font-weight:600;border-bottom:0}
details.tbl{margin-top:12px;border-top:1px solid var(--line-2);padding-top:10px}
details.tbl summary{cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.75}
.list-tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.list-tools input{min-height:38px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);width:260px;max-width:100%}
.person{min-width:180px}
.person b{font-weight:500;display:block}
.person span{color:var(--ink-3);font-size:12.5px;overflow-wrap:anywhere}
.links a{display:inline-block;margin-right:10px;white-space:nowrap}
.more{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{padding:22px 0;color:var(--ink-3)}
.how{display:grid;gap:10px;font-size:14px;color:var(--ink-2)}
.how dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.how dt{white-space:nowrap}
.how dd{margin:0}
@media (max-width:560px){.how dl{grid-template-columns:1fr}.how dd{margin-bottom:6px}}
.flag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.cmp{box-shadow:var(--shadow)}
.cmp-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
.cmp-head .go{font-size:13.5px;color:var(--accent-ink);font-weight:500;white-space:nowrap;text-decoration:none}
.cmp-head .go:hover{text-decoration:underline}
.verdict{display:flex;gap:12px;align-items:center;border-radius:12px;padding:12px 14px;background:var(--surface-2);font-size:15px;font-weight:500}
.verdict .ico{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.verdict.ok .ico{background:var(--st-good);color:#fff}
.verdict.warn .ico{background:var(--st-serious);color:#1b1b1b}
.pills{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px}
.pills .pg{display:inline-flex;align-items:center;gap:8px}
.pills .pg b{font-weight:500}
footer{color:var(--ink-3);font-size:12.5px;margin-top:28px}

/* Íconos y botones */
.ic{flex:none;display:inline-block;vertical-align:-2px}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px;border-radius:8px;gap:6px;text-decoration:none}
a.btn{text-decoration:none;color:inherit}
.btn.go{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--surface));font-weight:600}
.btn.go:hover{background:color-mix(in srgb,var(--accent) 15%,var(--surface))}
.btn.hs{color:var(--hs-ink);border-color:color-mix(in srgb,var(--hs) 45%,var(--line));background:color-mix(in srgb,var(--hs) 7%,var(--surface));font-weight:600}
.btn.hs:hover{background:color-mix(in srgb,var(--hs) 15%,var(--surface))}
.btn.warn{color:var(--crit-ink);border-color:color-mix(in srgb,var(--st-critical) 40%,var(--line));background:color-mix(in srgb,var(--st-critical) 7%,var(--surface));font-weight:600}
.btn.warn:hover{background:color-mix(in srgb,var(--st-critical) 14%,var(--surface))}
.btn.lg{min-height:44px;padding:10px 16px;font-size:14.5px;border-radius:10px}
.back{min-height:34px;padding:4px 12px 4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font-weight:500}
.back:hover{color:var(--ink);border-color:var(--accent)}

/* Periodo */
.periodo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:22px;display:grid;gap:12px;box-shadow:var(--shadow)}
.periodo .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.periodo .row.split{justify-content:space-between;gap:10px 18px}
.periodo .cap{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.periodo .chips{margin:0}
.periodo .chip{min-height:34px}
.sel-mas{min-height:34px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);font-size:13px;cursor:pointer;max-width:100%}
.sel-mas.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fechas{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.fecha{display:flex;gap:8px;align-items:center}
.fechas label{font-size:12.5px;color:var(--ink-3);font-weight:500}
.fechas input{min-height:36px;padding:4px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-variant-numeric:tabular-nums;max-width:100%}
.fechas input.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.meses{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.meses .cap{margin-right:2px}
.meses .chip{min-height:30px;padding:3px 11px;font-size:12.5px}
.rango-txt{font-size:13.5px;color:var(--ink-2)}
.rango-txt b{color:var(--ink);font-weight:600}
@media (max-width:640px){
  .periodo{padding:12px}
  .periodo .row.scroll{flex:1 1 100%!important;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px}
  .fechas{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .fecha{display:grid;gap:4px}
  .fecha input{width:100%}
  .periodo .row.scroll::-webkit-scrollbar{display:none}
  .periodo .row.scroll .chip,.periodo .row.scroll .sel-mas{flex:none}
}

/* KPIs que se abren */
a.tile{color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:border-color .15s,transform .15s,box-shadow .15s;position:relative}
a.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
a.tile.act{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),var(--shadow)}
a.tile .ver{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--accent-ink);display:inline-flex;gap:5px;align-items:center}
a.tile.alerta .n-val{color:var(--crit-ink)}
.intro{max-width:72ch;margin-bottom:18px}
.sec-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin:6px 0 12px}

/* Tarjeta de proveedor */
.prov h2 a{color:inherit;text-decoration:none}
.prov h2 a:hover{color:var(--accent-ink);text-decoration:underline}
.hbar a{display:block;height:100%;min-width:3px}
.hbar a:hover{filter:brightness(1.1)}
.stchips{display:flex;flex-wrap:wrap;gap:6px}
.stchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;text-decoration:none;color:var(--ink-2);min-height:28px}
.stchip:hover{border-color:var(--accent);color:var(--ink)}
.stchip i{width:8px;height:8px;border-radius:50%;flex:none}
.stchip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.prov-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

/* Números que se abren */
a.nlink{display:inline-block;min-width:30px;padding:1px 7px;border-radius:7px;text-decoration:none;color:var(--accent-ink);font-weight:600;background:color-mix(in srgb,var(--accent) 8%,transparent);text-align:right}
a.nlink:hover{background:color-mix(in srgb,var(--accent) 18%,transparent);text-decoration:underline}
a.nlink.crit{color:var(--crit-ink);background:color-mix(in srgb,var(--st-critical) 9%,transparent)}
.n0{color:var(--ink-3);padding:1px 7px;display:inline-block}
a.plink{color:var(--ink);text-decoration:none;font-weight:500}
a.plink:hover{color:var(--accent-ink);text-decoration:underline}
tr.act td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
td.acc{white-space:nowrap;width:1%}
td.acc .btn{display:flex;width:100%;margin:0 0 6px}
td.acc .btn:last-child{margin-bottom:0}
td.cuando{white-space:nowrap}
td.cuando span{display:block;color:var(--ink-3);font-size:12.5px}
section[id]{scroll-margin-top:16px}
.activos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 12px}
.fchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 6px 3px 12px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));font-size:13px;color:var(--ink)}
.fchip a{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--ink-2)}
.fchip a:hover{background:var(--surface-2);color:var(--ink)}
.nota{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-2);margin-bottom:16px}

/* Detalle del lead */
dialog.drawer{position:fixed;inset:0 0 0 auto;margin:0;width:min(480px,100vw);max-width:100vw;height:100%;max-height:100%;border:0;border-left:1px solid var(--line);padding:0;background:var(--surface);color:var(--ink);box-shadow:-24px 0 48px -24px rgba(0,0,0,.4);overflow-y:auto}
dialog.drawer::backdrop{background:rgba(15,20,27,.45)}
.dw-head{position:sticky;top:0;z-index:1;background:var(--surface);padding:18px 20px 14px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dw-head h2{font-size:20px;overflow-wrap:anywhere}
.dw-head .mail{color:var(--ink-2);font-size:13.5px;overflow-wrap:anywhere}
.dw-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.dw-x:hover{background:var(--surface-2)}
.dw-body{padding:18px 20px 32px;display:grid;gap:20px}
.dw-body h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:var(--body);font-weight:600;margin-bottom:10px}
.dw-acc{display:flex;flex-wrap:wrap;gap:8px}

<body>

<div id="gate" class="gate">
  <form class="gate-card" id="gate-form" autocomplete="off">
    <div style="display:grid;gap:6px">
      <div class="eyebrow">Pauta → HubSpot</div>
      <h1 style="font-size:24px">Reporte de leads de pauta</h1>
      <p class="sub" style="font-size:14px">Para ver el reporte, escribes la contraseña que te compartió el equipo de Black &amp; Orange.</p>
    </div>
    <div style="display:grid;gap:6px">
      <label for="pw">Contraseña</label>
      <input id="pw" class="field" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" id="gate-btn" type="submit">Ver el reporte</button>
    <div class="error" id="gate-err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <div class="ttl">
        <div class="eyebrow" id="eyebrow">Pauta → HubSpot</div>
        <h1 id="h1">Leads de pauta vs HubSpot</h1>
        <div class="meta-line" id="meta"></div>
      </div>
      <div class="actions">
        <button class="btn" id="btn-refresh" type="button">Actualizar</button>
        <button class="btn" id="btn-out" type="button">Salir</button>
      </div>
    </header>
    <div class="notice" id="notice" role="status" hidden></div>
    <section class="periodo" id="periodo" aria-label="Periodo del reporte"></section>
    <main id="view"></main>
    <footer id="foot"></footer>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<dialog class="drawer" id="drawer" aria-labelledby="dw-nombre"></dialog>

<script>
'use strict';
/* ---------- Estado ---------- */
// La ruta (#/…) y sus filtros viven en el hash: #/p/nods?r=30&v=resolver&g=3
//   r = periodo (todo, 7, 30, mes, m:2026-09, custom…) · d/h = desde/hasta (custom) · a = agrupar (dia|semana|mes)
//   v = vista de la lista · g = programa · pv = proveedor (vista global) · pg/fm = página/formulario (Meta) · ir = sección a mostrar
const S = { data: null, sobre: null, llave: null, path: '/', q: new URLSearchParams(), rango: { p: 'todo', d: '', h: '' }, lista: {}, ext: { lo: 0, hi: 0 }, meses: [] };
const EST = {
  completo:     { lbl: 'Negocio a tiempo', corto: 'A tiempo', v: '--st-good',     ico: '✓', fg: '#fff' },
  previo:       { lbl: 'Ya tenía negocio', corto: 'Ya tenía', v: '--st-neutral',  ico: '↺', fg: '#fff' },
  tardio:       { lbl: 'Negocio tardío',   corto: 'Tardío',   v: '--st-warn',     ico: '◷', fg: '#1b1b1b' },
  sin_negocio:  { lbl: 'Sin negocio',      corto: 'Sin negocio', v: '--st-serious', ico: '!', fg: '#1b1b1b' },
  sin_contacto: { lbl: 'Sin contacto',     corto: 'Sin contacto', v: '--st-critical', ico: '✕', fg: '#fff' },
};
const ORDEN = ['completo', 'previo', 'tardio', 'sin_negocio', 'sin_contacto'];
const $ = s => document.querySelector(s);

/* ---------- DOM seguro: todo dato va como texto ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const NS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
function badge(st, texto) {
  const e = EST[st];
  return h('span', { class: 'st' }, h('i', { style: `background:var(${e.v});color:${e.fg}`, 'aria-hidden': 'true' }, e.ico), texto ?? e.lbl);
}
const icono = d => s('svg', { class: 'ic', viewBox: '0 0 16 16', width: 14, height: 14, 'aria-hidden': 'true', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s('path', { d }));
const flecha = () => icono('M3 8h9.5M8.5 4l4 4-4 4');
const externo = () => icono('M9.5 2.5h4v4M13.5 2.5l-6 6M11.5 9.5v4h-9v-9h4');
const atrasIc = () => icono('M13 8H3.5M7.5 4l-4 4 4 4');
const cruz = () => icono('M4.5 4.5l7 7M11.5 4.5l-7 7');
const lupa = () => icono('M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10zM10.6 10.6L14 14');

/* ---------- Formatos y días (zona del portal) ---------- */
// Un "día" se guarda como la medianoche UTC de esa fecha en la zona del portal (k).
const DIA = 864e5;
let F = {};
function prepararFormatos(zona) {
  const o = { timeZone: zona };
  F.dia = new Intl.DateTimeFormat('es-MX', { ...o, day: 'numeric', month: 'short', year: 'numeric' });
  F.diaHora = new Intl.DateTimeFormat('es-MX', { ...o, day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  F.partes = new Intl.DateTimeFormat('en-CA', { ...o, year: 'numeric', month: '2-digit', day: '2-digit' });
  F.hora = new Intl.DateTimeFormat('es-MX', { ...o, hour: 'numeric', minute: '2-digit' });
  F.num = new Intl.NumberFormat('es-MX');
}
const fDia = t => F.dia.format(t).replace(/\./g, '');
const fDiaHora = t => F.diaHora.format(t).replace(/\./g, '');
const fechaCorta = t => F.dia.format(t).replace(/\./g, '');
const horaCorta = t => F.hora.format(t).replace(/\./g, '');
const fNum = n => F.num.format(n);
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESES_L = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
function claveDia(t) { const [y, m, d] = F.partes.format(t).split('-').map(Number); return Date.UTC(y, m - 1, d); }
const hoyK = () => claveDia(Date.now());
const semanaK = k => k - ((new Date(k).getUTCDay() + 6) % 7) * DIA;
const mesK = k => { const a = new Date(k); return Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), 1); };
const finMesK = k => { const a = new Date(k); return Date.UTC(a.getUTCFullYear(), a.getUTCMonth() + 1, 1) - DIA; };
function kDeFecha(x) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(x || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; }
const fechaDeK = k => new Date(k).toISOString().slice(0, 10);
const fK = (k, anio = true) => { const a = new Date(k); return `${a.getUTCDate()} ${MESES[a.getUTCMonth()]}${anio ? ' ' + a.getUTCFullYear() : ''}`; };
const llaveDe = (k, agr) => (agr === 'mes' ? mesK(k) : agr === 'semana' ? semanaK(k) : k);
const finPeriodo = (u, agr) => (agr === 'mes' ? finMesK(u) : agr === 'semana' ? u + 6 * DIA : u);
const siguiente = (u, agr) => finPeriodo(u, agr) + DIA;
function etiquetaPeriodo(u, agr) {
  const a = new Date(u);
  if (agr === 'mes') return `${MESES_L[a.getUTCMonth()]} ${a.getUTCFullYear()}`;
  if (agr === 'dia') return fK(u);
  const b = new Date(u + 6 * DIA);
  return a.getUTCMonth() === b.getUTCMonth()
    ? `${a.getUTCDate()} – ${b.getUTCDate()} ${MESES[b.getUTCMonth()]}`
    : `${a.getUTCDate()} ${MESES[a.getUTCMonth()]} – ${b.getUTCDate()} ${MESES[b.getUTCMonth()]}`;
}
function duracion(horas) {
  const a = Math.abs(horas);
  if (a < 1) return `${Math.max(1, Math.round(a * 60))} min`;
  if (a < 48) return `${Math.round(a)} h`;
  const d = Math.round(a / 24); return `${d} día${d === 1 ? '' : 's'}`;
}

/* ---------- Periodo ---------- */
const PRESETS = {
  todo:          { t: 'Todo' },
  '7':           { t: 'Últimos 7 días',  f: k => [k - 6 * DIA, k] },
  '30':          { t: 'Últimos 30 días', f: k => [k - 29 * DIA, k] },
  mes:           { t: 'Este mes',        f: k => [mesK(k), k] },
  mes_pasado:    { t: 'Mes pasado',      f: k => [mesK(mesK(k) - DIA), mesK(k) - DIA] },
  '90':          { t: 'Últimos 90 días', f: k => [k - 89 * DIA, k] },
  hoy:           { t: 'Hoy',             f: k => [k, k] },
  ayer:          { t: 'Ayer',            f: k => [k - DIA, k - DIA] },
  semana:        { t: 'Esta semana',     f: k => [semanaK(k), k] },
  semana_pasada: { t: 'Semana pasada',   f: k => [semanaK(k) - 7 * DIA, semanaK(k) - DIA] },
  '14':          { t: 'Últimos 14 días', f: k => [k - 13 * DIA, k] },
  trimestre:     { t: 'Este trimestre',  f: k => { const a = new Date(k); return [Date.UTC(a.getUTCFullYear(), Math.floor(a.getUTCMonth() / 3) * 3, 1), k]; } },
  anio:          { t: 'Este año',        f: k => [Date.UTC(new Date(k).getUTCFullYear(), 0, 1), k] },
};
const RAPIDOS = ['todo', '7', '30', 'mes', 'mes_pasado', '90'];
const MAS = ['hoy', 'ayer', 'semana', 'semana_pasada', '14', 'trimestre', 'anio'];
function limites() {
  const r = S.rango;
  if (r.p === 'custom') {
    let lo = kDeFecha(r.d), hi = kDeFecha(r.h);
    if (lo != null && hi != null && lo > hi) [lo, hi] = [hi, lo];
    return { lo: lo ?? -Infinity, hi: hi ?? Infinity };
  }
  const m = /^m:(\d{4}-\d{2})$/.exec(r.p);
  if (m) { const k = kDeFecha(m[1] + '-01'); return { lo: k, hi: finMesK(k) }; }
  const pr = PRESETS[r.p];
  if (pr && pr.f) { const [lo, hi] = pr.f(hoyK()); return { lo, hi }; }
  return { lo: -Infinity, hi: Infinity };
}
const enRango = (k, L) => k >= L.lo && k <= L.hi;
// Límites concretos (para mostrar y para las gráficas): lo abierto se cierra con los datos y hoy.
const bordes = L => ({ lo: Number.isFinite(L.lo) ? L.lo : S.ext.lo, hi: Number.isFinite(L.hi) ? L.hi : Math.max(S.ext.hi, hoyK()) });
function nombreRango() {
  const r = S.rango;
  if (r.p === 'custom') return 'Personalizado';
  const m = /^m:(\d{4})-(\d{2})$/.exec(r.p);
  if (m) return `${MESES_L[+m[2] - 1]} ${m[1]}`;
  return (PRESETS[r.p] || PRESETS.todo).t;
}
// Agrupación de las gráficas: la que eligió la persona o, si no, según el largo del periodo.
function agrupacion(L) {
  const a = S.q.get('a');
  if (a === 'dia' || a === 'semana' || a === 'mes') return a;
  const b = bordes(L); const dias = (Math.min(b.hi, hoyK()) - b.lo) / DIA + 1;
  return dias <= 31 ? 'dia' : dias <= 200 ? 'semana' : 'mes';
}

/* ---------- Rutas (el hash guarda vista y filtros) ---------- */
function leerRuta() {
  const [p, qs] = location.hash.replace(/^#/, '').split('?');
  S.path = p || '/'; S.q = new URLSearchParams(qs || '');
  const r = S.q.get('r') || 'todo';
  const valido = r === 'custom' || Object.hasOwn(PRESETS, r) || /^m:\d{4}-\d{2}$/.test(r);
  S.rango = valido ? { p: r, d: S.q.get('d') || '', h: S.q.get('h') || '' } : { p: 'todo', d: '', h: '' };
}
// Enlace a otra vista conservando solo el periodo.
function enlace(path, extra = {}) {
  const q = new URLSearchParams();
  for (const k of ['r', 'd', 'h']) if (S.q.get(k)) q.set(k, S.q.get(k));
  for (const [k, v] of Object.entries(extra)) if (v != null && v !== '') q.set(k, String(v));
  const t = q.toString(); return '#' + path + (t ? '?' + t : '');
}
// Enlace a esta misma vista con algunos filtros cambiados.
function aqui(cambios = {}) {
  const q = new URLSearchParams(S.q); q.delete('ir');
  for (const [k, v] of Object.entries(cambios)) { if (v == null || v === '') q.delete(k); else q.set(k, String(v)); }
  const t = q.toString(); return '#' + S.path + (t ? '?' + t : '');
}
// Cambia filtros sin perder la posición en la página.
function cambiar(cambios) { history.replaceState(null, '', aqui(cambios)); ruta(false); }
function fijarRango(r) {
  for (const k in S.lista) S.lista[k].n = 25;
  cambiar({ r: r.p === 'todo' ? null : r.p, d: r.p === 'custom' ? r.d : null, h: r.p === 'custom' ? r.h : null, a: null });
}
const hashRango = (lo, hi) => aqui({ r: 'custom', d: fechaDeK(lo), h: fechaDeK(hi), a: null });
const vistaActual = () => { const v = S.q.get('v'); return VISTAS.some(x => x[0] === v) ? v : 'resolver'; };

addEventListener('hashchange', () => ruta(true));
function ruta(arriba = true) {
  ocultarTip();
  const dlg = $('#drawer'); if (dlg.open) dlg.close();
  leerRuta(); actualizarBarra();
  if (S.path === '/meta') vistaConciliacion();
  else if (S.path === '/leads') vistaLeads();
  else {
    const m = S.path.match(/^\/p\/([\w-]+)/);
    const i = m ? S.data.proveedores.findIndex(p => p.id === m[1]) : -1;
    if (i >= 0) vistaProveedor(i); else vistaInicio();
  }
  const ir = S.q.get('ir');
  if (ir) {
    history.replaceState(null, '', aqui());
    const el = document.getElementById(ir);
    if (el) requestAnimationFrame(() => el.scrollIntoView({ block: 'start' }));
  } else if (arriba) scrollTo({ top: 0 });
}

/* ---------- Descifrado ---------- */
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function derivar(pw, sobre) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(sobre.sal), iterations: sobre.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function abrir(sobre, llave) {
  const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(sobre.iv) }, llave, b64(sobre.datos));
  const flujo = new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(flujo).text());
}
async function traerSobre() {
  const r = await fetch(`data.enc.json?v=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('No se encontró el archivo del reporte.');
  return r.json();
}
function guardarLlave(llave, sobre) {
  crypto.subtle.exportKey('raw', llave).then(raw => {
    try { sessionStorage.setItem('rp_llave', JSON.stringify({ sal: sobre.sal, k: btoa(String.fromCharCode(...new Uint8Array(raw))) })); } catch (e) { /* sin almacenamiento */ }
  });
}
async function llaveGuardada(sobre) {
  try {
    const g = JSON.parse(sessionStorage.getItem('rp_llave') || 'null');
    if (!g || g.sal !== sobre.sal) return null;
    return crypto.subtle.importKey('raw', b64(g.k), { name: 'AES-GCM' }, true, ['decrypt']);
  } catch (e) { return null; }
}

async function iniciar() {
  if (!window.crypto?.subtle || !('DecompressionStream' in window)) {
    $('#gate-err').textContent = 'Este navegador no puede abrir el reporte. Para verlo, lo abres en una versión reciente de Chrome, Edge, Safari o Firefox.';
    $('#gate-btn').disabled = true; return;
  }
  try { S.sobre = await traerSobre(); } catch (e) { $('#gate-err').textContent = 'El reporte todavía no se ha generado. Vuelve a intentarlo en unos minutos.'; return; }
  const k = await llaveGuardada(S.sobre);
  if (k) { try { S.data = await abrir(S.sobre, k); S.llave = k; return entrar(); } catch (e) { /* pedir contraseña */ } }
  $('#pw').focus();
}
$('#gate-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('#gate-btn'); btn.disabled = true; btn.textContent = 'Abriendo…'; $('#gate-err').textContent = '';
  try {
    if (!S.sobre) S.sobre = await traerSobre();
    const llave = await derivar($('#pw').value, S.sobre);
    S.data = await abrir(S.sobre, llave); S.llave = llave; guardarLlave(llave, S.sobre);
    $('#pw').value = ''; entrar();
  } catch (e) {
    $('#gate-err').textContent = 'La contraseña no coincide. Revisa que esté completa, con mayúsculas y minúsculas.';
  } finally { btn.disabled = false; btn.textContent = 'Ver el reporte'; }
});
$('#btn-out').addEventListener('click', () => { try { sessionStorage.removeItem('rp_llave'); } catch (e) {} location.hash = ''; location.reload(); });

function entrar() {
  prepararFormatos(S.data.zona || 'America/Mexico_City');
  indexar();
  $('#gate').hidden = true; $('#app').hidden = false;
  document.title = `${S.data.titulo} · ${S.data.cliente}`;
  $('#eyebrow').textContent = `${S.data.cliente} · Pauta → HubSpot`;
  $('#h1').textContent = S.data.titulo;
  construirBarra(); pintarMeta(); ruta();
}

function indexar() {
  const d = S.data;
  d.porProv = d.proveedores.map(() => []);
  let lo = Infinity, hi = -Infinity;
  for (const l of d.leads) { l.k = claveDia(l.t); d.porProv[l.p]?.push(l); if (l.k < lo) lo = l.k; if (l.k > hi) hi = l.k; }
  if (!Number.isFinite(lo)) lo = hi = hoyK();
  S.ext = { lo, hi };
  const meses = [];
  for (let m = mesK(lo); m <= mesK(Math.max(hi, hoyK())); m = finMesK(m) + DIA) meses.push(m);
  S.meses = meses.slice(-6);
}
function pintarMeta() {
  const d = S.data, r = d.reglas;
  $('#meta').replaceChildren(
    h('span', null, 'Actualizado: ', h('b', null, fDiaHora(Date.parse(d.generadoEn)))),
    h('span', null, 'Negocio a tiempo: ', h('b', null, `≤ ${r.ventanaNegocioHoras} h`)),
    h('span', null, 'Contacto desfasado: ', h('b', null, `> ${r.desfaseMin} min`)),
  );
  $('#foot').textContent = 'Los datos se leen de Meta, de las bases de cada proveedor y de HubSpot en modo de solo lectura. El reporte se actualiza solo cada hora.';
}

/* ---------- Barra de periodo (una sola para todo el reporte) ---------- */
const B = {};
function construirBarra() {
  B.rapidos = RAPIDOS.map(k => h('button', { type: 'button', class: 'chip', onclick: () => fijarRango({ p: k }) }, PRESETS[k].t));
  B.mas = h('select', { class: 'sel-mas', 'aria-label': 'Más periodos', onchange: e => { if (e.target.value) fijarRango({ p: e.target.value }); } },
    h('option', { value: '' }, 'Más periodos…'), MAS.map(k => h('option', { value: k }, PRESETS[k].t)));
  B.meses = h('div', { class: 'meses', role: 'group', 'aria-label': 'Ver un mes' });
  B.desde = h('input', { type: 'date', id: 'r-desde' });
  B.hasta = h('input', { type: 'date', id: 'r-hasta' });
  const valida = x => { const k = kDeFecha(x); if (k == null) return false; const y = new Date(k).getUTCFullYear(); return y >= 2020 && y <= 2100; };
  const alCambiar = () => {
    clearTimeout(B.t);
    B.t = setTimeout(() => {
      const d = B.desde.value, hh = B.hasta.value;
      if ((d && !valida(d)) || (hh && !valida(hh)) || (!d && !hh)) return;
      fijarRango({ p: 'custom', d, h: hh });
    }, 400);
  };
  for (const inp of [B.desde, B.hasta]) { inp.addEventListener('change', alCambiar); inp.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(B.t); alCambiar(); } }); }
  B.txt = h('p', { class: 'rango-txt', 'aria-live': 'polite' });

function aviso(txt) { const n = $('#notice'); n.textContent = txt; n.hidden = !txt; }
// Trae la versión publicada; si es nueva, la abre con la misma llave (la sal no cambia entre
// actualizaciones). Si la contraseña se cambió, vuelve a pedirla.
async function recargarSiHayNuevo() {
  const sobre = await traerSobre();
  if (sobre.datos === S.sobre.datos) return false;
  try {
    if (sobre.sal !== S.sobre.sal) throw new Error('otra sal');
    S.data = await abrir(sobre, S.llave); S.sobre = sobre;
  } catch (e) { try { sessionStorage.removeItem('rp_llave'); } catch (x) {} location.reload(); return true; }
  indexar(); pintarMeta(); ruta(false); return true;
}
$('#btn-refresh').addEventListener('click', async () => {
  const btn = $('#btn-refresh'); btn.disabled = true;
  const antes = S.data.generadoEn;
  try {
    const cfg = S.data.actualizar;
    if (cfg && cfg.url) {
      btn.textContent = 'Actualizando…';
      aviso('Pedimos una actualización a HubSpot y a las bases de los proveedores. Tarda de 1 a 3 minutos; la página se refresca sola cuando termina.');
      await fetch(cfg.url, { method: 'POST', mode: 'no-cors', headers: { 'content-type': 'text/plain' }, body: JSON.stringify({ clave: cfg.clave }) });
      const inicio = Date.now();
      while (Date.now() - inicio < 6 * 60e3) {
        await new Promise(r => setTimeout(r, 15000));
        const m = await fetch(`meta.json?v=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()).catch(() => null);
        if (m && m.generadoEn && m.generadoEn !== antes) { await recargarSiHayNuevo(); aviso(''); return; }
      }
      aviso('La actualización está tardando más de lo normal. Puedes seguir usando el reporte; los datos nuevos aparecen al volver a entrar.');
    } else {
      btn.textContent = 'Buscando…';
      const cambio = await recargarSiHayNuevo();
      aviso(cambio ? '' : `Ya estás viendo la versión más reciente (${fDiaHora(Date.parse(antes))}). El reporte se actualiza solo cada hora.`);
    }
  } catch (e) {
    aviso('No se pudo actualizar en este momento. Vuelve a intentarlo en unos minutos.');
  } finally { btn.disabled = false; btn.textContent = 'Actualizar'; }
});
